name: lls-stack

x-argilla-env: &argilla-env
  ARGILLA_HOME_PATH: /var/lib/argilla
  ARGILLA_ELASTICSEARCH: http://elasticsearch:9200
  ARGILLA_DATABASE_URL: postgresql+asyncpg://postgres:postgres@argilla-postgres:5432/argilla
  ARGILLA_REDIS_URL: redis://redis:6379/0

services:
  panel:
    image: ${PANEL_IMAGE:-llm-labeling-scaffold-panel:local}
    build:
      context: .
      dockerfile: docker/panel/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://repo.huaweicloud.com/repository/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-repo.huaweicloud.com}
        PANEL_UID: ${PANEL_UID:-1000}
        PANEL_GID: ${PANEL_GID:-1000}
    user: "${PANEL_UID:-1000}:${PANEL_GID:-1000}"
    restart: unless-stopped
    expose:
      - "8765"
    environment:
      LLS_PANEL_DEPLOYMENT_MODE: docker_tunnel
      LLS_PANEL_AUTH_MODE: ${LLS_PANEL_AUTH_MODE:-cloudflare_access}
      LLS_PANEL_PASSWORD: ${LLS_PANEL_PASSWORD:-}
      LLS_CF_ACCESS_ISSUER: ${LLS_CF_ACCESS_ISSUER:-}
      LLS_CF_ACCESS_AUD: ${LLS_CF_ACCESS_AUD:-}
      LLS_CF_ACCESS_JWKS_TTL_SECONDS: ${LLS_CF_ACCESS_JWKS_TTL_SECONDS:-300}
      LLS_CF_ACCESS_HTTP_TIMEOUT_SECONDS: ${LLS_CF_ACCESS_HTTP_TIMEOUT_SECONDS:-5}
      LLS_CF_ACCESS_CLOCK_SKEW_SECONDS: ${LLS_CF_ACCESS_CLOCK_SKEW_SECONDS:-0}
      LLS_MCP_CF_ACCESS_ISSUER: ${LLS_MCP_CF_ACCESS_ISSUER:-}
      LLS_MCP_CF_ACCESS_AUD: ${LLS_MCP_CF_ACCESS_AUD:-}
      LLS_MCP_CF_ACCESS_JWKS_TTL_SECONDS: ${LLS_MCP_CF_ACCESS_JWKS_TTL_SECONDS:-300}
      LLS_MCP_CF_ACCESS_HTTP_TIMEOUT_SECONDS: ${LLS_MCP_CF_ACCESS_HTTP_TIMEOUT_SECONDS:-5}
      LLS_MCP_CF_ACCESS_CLOCK_SKEW_SECONDS: ${LLS_MCP_CF_ACCESS_CLOCK_SKEW_SECONDS:-0}
      LLS_DATABASE_HOST: scaffold-postgres
      LLS_DATABASE_PORT: 5432
      LLS_DATABASE_USER: ${SCAFFOLD_POSTGRES_APP_USER:-scaffold_app}
      LLS_DATABASE_PASSWORD: ${SCAFFOLD_POSTGRES_APP_PASSWORD:?Set SCAFFOLD_POSTGRES_APP_PASSWORD}
      LLS_DATABASE_NAME: ${SCAFFOLD_POSTGRES_DB:-scaffold}
      LLS_MCP_INTERNAL_TOKEN: ${LLS_MCP_INTERNAL_TOKEN:-}
      LLS_MCP_ENABLE_WRITES: ${LLS_MCP_ENABLE_WRITES:-0}
      ARGILLA_API_URL: http://argilla:6900
      ARGILLA_API_KEY: ${ARGILLA_API_KEY:-argilla.apikey}
      ARGILLA_WORKSPACE: ${ARGILLA_WORKSPACE:-argilla}
      MLFLOW_TRACKING_URI:
      RCLONE_CONFIG: ${RCLONE_CONFIG:-/run/secrets/rclone/rclone.conf}
      LLS_RCLONE_TIMEOUT_SECONDS: ${LLS_RCLONE_TIMEOUT_SECONDS:-120}
      # r2 从 R2 registry 同步任务；control 由 scaffold 控制面管理任务草稿和发布 revision。
      LLS_TASK_SOURCE: ${LLS_TASK_SOURCE:-control}
      # r2 模式中这是任务 registry；control 模式中它只配置任务的数据湖 registry。YOUR_BUCKET 是占位示例。
      LLS_TASK_REGISTRY_URI: ${LLS_TASK_REGISTRY_URI:-r2:YOUR_BUCKET/governance/data_lake/v1/current/data_lake.yaml}
      LLS_DATA_LAKE_R2_PREFIX: ${LLS_DATA_LAKE_R2_PREFIX:-r2:YOUR_BUCKET/}
    volumes:
      - ./runs:/app/runs
      - ./tasks:/app/tasks
      - ./configs:/app/configs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      argilla:
        condition: service_started
    networks:
      - lls

  migrate:
    image: ${PANEL_IMAGE:-llm-labeling-scaffold-panel:local}
    user: "${PANEL_UID:-1000}:${PANEL_GID:-1000}"
    restart: "no"
    environment:
      - LLS_DATABASE_HOST=scaffold-postgres
      - LLS_DATABASE_PORT=5432
      - LLS_DATABASE_USER=${SCAFFOLD_POSTGRES_OWNER_USER:-scaffold_owner}
      - LLS_DATABASE_PASSWORD=${SCAFFOLD_POSTGRES_OWNER_PASSWORD:?Set SCAFFOLD_POSTGRES_OWNER_PASSWORD}
      - LLS_DATABASE_NAME=${SCAFFOLD_POSTGRES_DB:-scaffold}
    command: ["python", "-m", "llm_labeling_scaffold.cli", "db", "upgrade"]
    depends_on:
      db-role-init:
        condition: service_completed_successfully
    networks:
      - lls

  db-role-init:
    image: postgres:16
    restart: "no"
    environment:
      PGHOST: scaffold-postgres
      PGPASSWORD: ${SCAFFOLD_POSTGRES_OWNER_PASSWORD:?Set SCAFFOLD_POSTGRES_OWNER_PASSWORD}
      POSTGRES_USER: ${SCAFFOLD_POSTGRES_OWNER_USER:-scaffold_owner}
      POSTGRES_DB: ${SCAFFOLD_POSTGRES_DB:-scaffold}
      SCAFFOLD_POSTGRES_APP_USER: ${SCAFFOLD_POSTGRES_APP_USER:-scaffold_app}
      SCAFFOLD_POSTGRES_APP_PASSWORD: ${SCAFFOLD_POSTGRES_APP_PASSWORD:?Set SCAFFOLD_POSTGRES_APP_PASSWORD}
      LLS_RUNTIME_ROLE_SQL_PATH: /usr/local/share/lls/init-runtime-role.sql
    command: ["/usr/local/bin/lls-init-runtime-role"]
    volumes:
      - ./docker/postgres/init-runtime-role.sh:/usr/local/bin/lls-init-runtime-role:ro
      - ./docker/postgres/init-runtime-role.sql:/usr/local/share/lls/init-runtime-role.sql:ro
    depends_on:
      scaffold-postgres:
        condition: service_healthy
    networks:
      - lls

  mcp:
    image: ${PANEL_IMAGE:-llm-labeling-scaffold-panel:local}
    profiles: ["mcp"]
    user: "${PANEL_UID:-1000}:${PANEL_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${MCP_BIND_HOST:-127.0.0.1}:${MCP_PORT:-8766}:8766"
    environment:
      - LLS_MCP_PANEL_URL=http://panel:8765
      - LLS_MCP_AUTH_MODE=${LLS_MCP_AUTH_MODE:-cloudflare_access}
      - LLS_MCP_CF_ACCESS_ISSUER=${LLS_MCP_CF_ACCESS_ISSUER:-}
      - LLS_MCP_CF_ACCESS_AUD=${LLS_MCP_CF_ACCESS_AUD:-}
      - LLS_MCP_CF_ACCESS_JWKS_TTL_SECONDS=${LLS_MCP_CF_ACCESS_JWKS_TTL_SECONDS:-300}
      - LLS_MCP_CF_ACCESS_HTTP_TIMEOUT_SECONDS=${LLS_MCP_CF_ACCESS_HTTP_TIMEOUT_SECONDS:-5}
      - LLS_MCP_CF_ACCESS_CLOCK_SKEW_SECONDS=${LLS_MCP_CF_ACCESS_CLOCK_SKEW_SECONDS:-0}
      - LLS_CF_ACCESS_AUD=${LLS_CF_ACCESS_AUD:-}
      - LLS_MCP_BEARER_TOKEN=${LLS_MCP_BEARER_TOKEN:-}
      - LLS_MCP_INTERNAL_TOKEN=${LLS_MCP_INTERNAL_TOKEN:-}
      - LLS_MCP_ENABLE_WRITES=${LLS_MCP_ENABLE_WRITES:-0}
      - LLS_MCP_TIMEOUT_SECONDS=${LLS_MCP_TIMEOUT_SECONDS:-15}
    command: ["python", "-m", "llm_labeling_scaffold.cli", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--published-host", "${MCP_BIND_HOST:-127.0.0.1}", "--port", "8766"]
    depends_on:
      - panel
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lls

  argilla:
    image: argilla/argilla-server:latest
    restart: unless-stopped
    ports:
      - "${ARGILLA_PORT:-6900}:6900"
    environment:
      <<: *argilla-env
      USERNAME: ${ARGILLA_USERNAME:-argilla}
      PASSWORD: ${ARGILLA_PASSWORD:-12345678}
      API_KEY: ${ARGILLA_API_KEY:-argilla.apikey}
      WORKSPACE: ${ARGILLA_WORKSPACE:-argilla}
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - argilla-data:/var/lib/argilla
    depends_on:
      argilla-postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lls

  argilla-worker:
    image: argilla/argilla-server:latest
    restart: unless-stopped
    environment:
      <<: *argilla-env
      BACKGROUND_NUM_WORKERS: ${ARGILLA_BACKGROUND_WORKERS:-2}
      HF_HUB_DISABLE_TELEMETRY: "1"
    command: sh -c 'python -m argilla_server worker --num-workers $${BACKGROUND_NUM_WORKERS}'
    depends_on:
      argilla-postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lls

  scaffold-postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${SCAFFOLD_POSTGRES_BIND_HOST:-127.0.0.1}:${SCAFFOLD_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${SCAFFOLD_POSTGRES_OWNER_USER:-scaffold_owner}
      POSTGRES_PASSWORD: ${SCAFFOLD_POSTGRES_OWNER_PASSWORD:?Set SCAFFOLD_POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: ${SCAFFOLD_POSTGRES_DB:-scaffold}
      SCAFFOLD_POSTGRES_APP_USER: ${SCAFFOLD_POSTGRES_APP_USER:-scaffold_app}
      SCAFFOLD_POSTGRES_APP_PASSWORD: ${SCAFFOLD_POSTGRES_APP_PASSWORD:?Set SCAFFOLD_POSTGRES_APP_PASSWORD}
      LLS_RUNTIME_ROLE_SQL_PATH: /usr/local/share/lls/init-runtime-role.sql
    volumes:
      - scaffold-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-init-runtime-role.sh:ro
      - ./docker/postgres/init-runtime-role.sql:/usr/local/share/lls/init-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lls

  argilla-postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: argilla
    volumes:
      - argilla-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d argilla"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      lls:
        aliases:
          - postgres

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms256m -Xmx256m}
      node.name: elasticsearch
      cluster.name: es-argilla-local
      discovery.type: single-node
      cluster.routing.allocation.disk.threshold_enabled: "false"
      xpack.security.enabled: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=1s >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - lls

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - lls

  mlflow:
    profiles:
      - mlflow
    build:
      context: ./docker/mlflow
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://repo.huaweicloud.com/repository/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-repo.huaweicloud.com}
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --serve-artifacts
    volumes:
      - mlflow-data:/mlflow
    networks:
      - lls

networks:
  lls:
    driver: bridge

volumes:
  scaffold-postgres-data:
  argilla-data:
  argilla-postgres-data:
  elasticsearch-data:
  mlflow-data:
