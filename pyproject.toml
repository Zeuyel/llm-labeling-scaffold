[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-labeling-scaffold"
version = "0.1.0"
description = "Task-agnostic LLM labeling and local-model extrapolation scaffold"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "PyJWT[crypto]>=2.8,<3",
  "jsonschema>=4.0",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
baseline = [
  "scikit-learn>=1.3",
  "joblib>=1.3",
]
mlflow = [
  "mlflow>=2.0",
]
argilla = [
  "argilla>=2.8,<2.9",
]
integrations = [
  "argilla>=2.8,<2.9",
  "mlflow>=2.0",
]
mcp = [
  "mcp>=1.28,<2",
  "httpx>=0.27,<1",
]
dev = [
  "pytest>=8.0",
  "mcp>=1.28,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
lls = "llm_labeling_scaffold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
