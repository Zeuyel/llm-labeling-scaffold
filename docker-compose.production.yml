services:
  panel:
    environment:
      LLS_DEPLOYMENT_MODE: tunnel
      LLS_PANEL_AUTH_MODE: cloudflare_access
      LLS_CF_ACCESS_ISSUER: ${LLS_CF_ACCESS_ISSUER:?Set LLS_CF_ACCESS_ISSUER}
      LLS_CF_ACCESS_AUD: ${LLS_CF_ACCESS_AUD:?Set LLS_CF_ACCESS_AUD}
      ARGILLA_USERNAME: ${ARGILLA_USERNAME:?Set ARGILLA_USERNAME}
      ARGILLA_API_KEY: ${ARGILLA_API_KEY:?Set ARGILLA_API_KEY}
      ARGILLA_WORKSPACE: ${ARGILLA_WORKSPACE:?Set ARGILLA_WORKSPACE}
      SCAFFOLD_POSTGRES_APP_PASSWORD: ${SCAFFOLD_POSTGRES_APP_PASSWORD:?Set SCAFFOLD_POSTGRES_APP_PASSWORD}

  argilla:
    environment:
      USERNAME: ${ARGILLA_USERNAME:?Set ARGILLA_USERNAME}
      PASSWORD: ${ARGILLA_PASSWORD:?Set ARGILLA_PASSWORD}
      API_KEY: ${ARGILLA_API_KEY:?Set ARGILLA_API_KEY}
      WORKSPACE: ${ARGILLA_WORKSPACE:?Set ARGILLA_WORKSPACE}
      ARGILLA_DATABASE_URL: postgresql+asyncpg://${ARGILLA_POSTGRES_USER:?Set ARGILLA_POSTGRES_USER}:${ARGILLA_POSTGRES_PASSWORD:?Set ARGILLA_POSTGRES_PASSWORD}@argilla-postgres:5432/${ARGILLA_POSTGRES_DB:-argilla}

  argilla-postgres:
    environment:
      POSTGRES_USER: ${ARGILLA_POSTGRES_USER:?Set ARGILLA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ARGILLA_POSTGRES_PASSWORD:?Set ARGILLA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ARGILLA_POSTGRES_DB:-argilla}

  elasticsearch:
    environment:
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
